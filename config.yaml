# Central configuration: edit this instead of touching code.
data:
  path: "C:\MLOps_insurance_modelprediction\data\raw\insurance.csv"        # CSV used for training
  target: charges              # name of the label column
  test_size: 0.2
  random_state: 1

model:
  type: random_forest_regression            # random_forest | logistic_regression
  params:
    n_estimators: 100
    max_depth: 5

artifacts:
  model_dir: models             # versioned models are saved here
  report_dir: reports           # metrics JSON files are saved here
